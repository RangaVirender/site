function sortYear(y) {
  // extract first 4-digit year for sorting
  return -(parseInt(y.match(/\d{4}/)?.[0] ?? "0"));
}

function groupByYear(entries) {
  const map = new Map();
  for (const e of entries) {
    if (!map.has(e.year)) map.set(e.year, []);
    map.get(e.year).push(e);
  }
  // sort descending
  return new Map([...map.entries()].sort((a, b) => sortYear(a[0]) - sortYear(b[0])));
}

function buildTimeline(entries, panelId) {
  const grouped = groupByYear(entries);
  const tl = document.createElement('div');
  tl.className = 'timeline';

  grouped.forEach((items, year) => {
    const slug = year.replace(/[^a-z0-9]/gi, '-');
    const group = document.createElement('div');
    group.className = 'year-group';
    group.id = `${panelId}-yr-${slug}`;

    const heading = document.createElement('div');
    heading.className = 'year-heading';
    heading.innerHTML = `<div class="year-node"></div><span class="year-label">${year}</span><div class="year-divider"></div>`;
    group.appendChild(heading);

    for (const e of items) {
      const card = document.createElement('div');
      card.className = 'event-card';
      card.innerHTML = `
        <span class="event-type type-${e.type}">${e.label}</span>
        <p class="event-text">${e.text}</p>
        ${e.venue ? `<p class="event-venue">${e.venue}</p>` : ''}
      `;
      group.appendChild(card);
    }
    tl.appendChild(group);
  });
  return tl;
}

function buildYearNav(panelId) {
  const nav = document.getElementById('year-nav');
  nav.innerHTML = '<p class="year-nav-label">Jump to year</p>';
  const panel = document.getElementById('panel-' + panelId);
  if (!panel) return;
  panel.querySelectorAll('.year-group[id]').forEach(g => {
    const yr = g.querySelector('.year-label').textContent;
    const a = document.createElement('a');
    a.href = '#' + g.id;
    a.className = 'year-link';
    a.textContent = yr;
    nav.appendChild(a);
  });
}

  panelsEl.appendChild(div);
}

makePanel('academic', buildTimeline(ACADEMIC, 'academic'));
makePanel('extracurricular', buildTimeline(EXTRACURRICULAR, 'extracurricular'));
makePanel('memberships', buildMemberships());

// Set counts
document.getElementById('count-academic').textContent = ACADEMIC.length;
document.getElementById('count-extracurricular').textContent = EXTRACURRICULAR.length;
document.getElementById('count-memberships').textContent = MEMBERSHIPS.length;

// Stats
const allYears = new Set([...ACADEMIC, ...EXTRACURRICULAR].map(e => e.year.match(/\d{4}/)?.[0]).filter(Boolean));
document.getElementById('stat-years').textContent = allYears.size + '+';
const presentations = ACADEMIC.filter(e => ['oral','poster','seminar'].includes(e.type)).length;
document.getElementById('stat-presentations').textContent = presentations + '+';

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const panel = document.getElementById('panel-' + btn.dataset.tab);
    if (panel) panel.classList.add('active');
    buildYearNav(btn.dataset.tab);
  });
});

// Activate first tab
document.getElementById('panel-academic').classList.add('active');
buildYearNav('academic');

// Scroll spy
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      document.querySelectorAll('.year-link').forEach(a => {
        a.classList.toggle('active', a.getAttribute('href') === '#' + entry.target.id);
      });
    }
  });
}, { rootMargin: '-30% 0px -60% 0px' });

document.querySelectorAll('.year-group[id]').forEach(g => observer.observe(g));

// Particle background
(function() {
  const canvas = document.getElementById('particle-bg');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  function rand(a, b) { return a + Math.random() * (b - a); }

  class Particle {
    constructor() { this.reset(); }
    reset() { this.x=rand(0,W); this.y=rand(0,H); this.vx=rand(-0.4,0.4); this.vy=rand(-0.8,-0.2); this.alpha=rand(0.2,0.6); this.radius=rand(1,2.5); this.color=Math.random()>0.6?'#C8923A':'#3D7A7A'; this.decay=rand(0.002,0.006); }
    update() { this.x+=this.vx; this.y+=this.vy; this.alpha-=this.decay; if(this.alpha<=0)this.reset(); }
    draw() { ctx.save(); ctx.globalAlpha=this.alpha; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  }
  class Track {
    constructor() { this.reset(); }
    reset() { this.x=rand(0,W); this.y=rand(H*0.1,H*0.9); this.length=rand(40,120); this.angle=rand(-0.3,0.3); this.alpha=rand(0.05,0.2); this.color=Math.random()>0.5?'#C8923A':'#2D4A7A'; this.speed=rand(0.5,2); this.progress=0; }
    update() { this.progress+=this.speed; if(this.progress>this.length+60)this.reset(); }
    draw() { const d=Math.min(this.progress,this.length); ctx.save(); ctx.globalAlpha=this.alpha*Math.min(1,d/20)*Math.max(0,1-(this.progress-this.length)/60); ctx.strokeStyle=this.color; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(this.x,this.y); ctx.lineTo(this.x+Math.cos(this.angle)*d,this.y+Math.sin(this.angle)*d); ctx.stroke(); ctx.restore(); }
  }

  const particles = Array.from({length:60}, () => new Particle());
  const tracks = Array.from({length:20}, () => new Track());
  function loop() { ctx.clearRect(0,0,W,H); tracks.forEach(t=>{t.update();t.draw();}); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(loop); }
  loop();
})();
</script>
</body>
