<!DOCTYPE html>
<html>
<head>
<script src="physics.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h2>Coulomb Barrier</h2>
Z1: <input id="z1" value="1">
Z2: <input id="z2" value="5">
R (fm): <input id="r" value="3">

<button onclick="calcBarrier()">Compute</button>

<p id="result"></p>

<h2>Cross Section Plot</h2>
<canvas id="plot"></canvas>

<script>
Module.onRuntimeInitialized = () => {

    const barrier = Module.cwrap('coulomb_barrier', 'number', ['number','number','number']);
    const cs = Module.cwrap('rutherford_cs', 'number', ['number','number','number','number']);

    window.calcBarrier = function() {
        let Z1 = +document.getElementById("z1").value;
        let Z2 = +document.getElementById("z2").value;
        let R = +document.getElementById("r").value;

        let V = barrier(Z1, Z2, R);
        document.getElementById("result").innerText = "Barrier = " + V.toFixed(3) + " MeV";
    }

    // Generate angular distribution
    let angles = [];
    let values = [];

    for(let t=10; t<=170; t+=5){
        angles.push(t);
        values.push(cs(t,1,5,10));
    }

    new Chart(document.getElementById("plot"), {
        type: 'line',
        data: {
            labels: angles,
            datasets: [{
                label: "Rutherford dσ/dΩ",
                data: values
            }]
        }
    });

}
</script>

</body>
</html>
