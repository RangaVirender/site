<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V. RANGA — Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0a0e1a;
      --navy2:  #111827;
      --teal:   #4ecdc4;
      --orange: #ff6b35;
      --slate:  #8892a4;
      --white:  #f0f4ff;
      --card:   #131929;
      --border: rgba(78, 205, 196, 0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── CANVAS ── */
    #canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
    }

    /* ── LAYOUT ── */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 0;
    }

    .nav-logo {
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.15em;
      color: var(--slate);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-logo:hover { color: var(--teal); }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }
    .nav-links a {
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.08em;
      color: var(--slate);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-links a.active { color: var(--teal); }

    /* ── HERO ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 72px 0 56px;
    }

    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--white);
    }

    .hero h1 span {
      background: linear-gradient(90deg, var(--teal), var(--orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      margin-top: 18px;
      font-size: 16px;
      color: var(--slate);
      font-weight: 300;
      max-width: 480px;
      line-height: 1.6;
    }

    /* ── SECTION ── */
    section {
      margin-bottom: 52px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .section-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .section-icon.teal { background: rgba(78,205,196,0.12); }
    .section-icon.orange { background: rgba(255,107,53,0.12); }
    .section-icon svg { width: 16px; height: 16px; }
    .section-icon.teal svg { stroke: var(--teal); }
    .section-icon.orange svg { stroke: var(--orange); }

    .section-title {
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--slate);
    }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .nav-links { gap: 16px; }
    }

    /* ── CARD ── */
    .card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 18px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      transition: border-color 0.22s, transform 0.22s, box-shadow 0.22s;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.22s;
    }
    .card.teal::before  { background: linear-gradient(135deg, rgba(78,205,196,0.06) 0%, transparent 60%); }
    .card.orange::before { background: linear-gradient(135deg, rgba(255,107,53,0.06) 0%, transparent 60%); }

    .card:hover { transform: translateY(-2px); }
    .card.teal:hover  { border-color: rgba(78,205,196,0.45);  box-shadow: 0 8px 32px rgba(78,205,196,0.1); }
    .card.orange:hover { border-color: rgba(255,107,53,0.45); box-shadow: 0 8px 32px rgba(255,107,53,0.1); }
    .card:hover::before { opacity: 1; }

    .card-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 6px;
    }
    .teal  .card-dot { background: var(--teal); box-shadow: 0 0 8px var(--teal); }
    .orange .card-dot { background: var(--orange); box-shadow: 0 0 8px var(--orange); }

    .card-text {}
    .card-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--white);
      line-height: 1.3;
    }
    .card-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--slate);
      margin-top: 4px;
      letter-spacing: 0.03em;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--slate);
      margin-top: 48px;
      opacity: 0.6;
    }

    /* ── REDUCED MOTION ── */
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="wrap">
  <nav>
    <a href="https://www.vranga.in/home" class="nav-logo">V. Ranga</a>

  </nav>

  <div class="hero">
    <p class="hero-eyebrow">Nuclear Physics · Tools &amp; Resources</p>
    <h1>Useful <span>Links</span></h1>
    <p class="hero-sub">Calculators, visualisations, and tools for nuclear reaction physics and detector science.</p>
  </div>

  <footer>VR · <a href="https://www.vranga.in" style="color:var(--slate);text-decoration:none;transition:color 0.2s;" onmouseover="this.style.color='var(--teal)'" onmouseout="this.style.color='var(--slate)'">www.vranga.in</a></footer>
</div>

<script>
/* ================================================================
   LINKS DATA — add a new entry here to add a card to the page.
   Each object needs:
     name  — display title
     url   — full URL
   The domain shown under the title is extracted automatically.
   ================================================================ */

const SECTIONS = [
  {
    title: 'Calculators',
    color: 'teal',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
             <rect x="4" y="2" width="16" height="20" rx="2"/>
             <path d="M8 7h8M8 11h8M8 15h5"/>
           </svg>`,
    links: [
      { name: 'Two-body Kinematics',       url: 'https://skisickness.com/2020/02/kinematics/' },
      { name: 'Cross-section Calculator',  url: 'https://rangavirender.github.io/site/cross-section-calculator.html' },
      { name: 'Gamow-window Calculator',   url: 'https://rangavirender.github.io/site/gamow-window-calculator.html' },
      { name: 'NRV Browser',               url: 'http://nrv.jinr.ru/nrv/' },
      { name: 'Coulomb Barrier Calculator',url: 'https://rangavirender.github.io/site/coulomb_barrier_calculator.html' },
      { name: 'Two-body Kinematics NRV',   url: 'http://nrv.jinr.ru/nrv/mobilenrv/kinematics/Kinematics2Body.html' },
      { name: 'Lab Energy → CM Energy',    url: 'https://rangavirender.github.io/site/com_lab_converter.html' },
      { name: 'Current Activity Calculator', url: 'https://rangavirender.github.io/site/activity_calculator.html' },
      /* ADD NEW CALCULATORS HERE */
    ],
  },
  {
    title: 'Animations & Visualisations',
    color: 'orange',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
             <circle cx="12" cy="12" r="3"/>
             <path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
           </svg>`,
    links: [
      { name: 'Nuclear Reaction Animation',      url: 'https://rangavirender.github.io/site/nuclear-reaction-animation.html' },
      { name: 'Nucleus Image Generator',         url: 'https://rangavirender.github.io/site/nucleus_image_generator.html' },
      { name: 'Scintillation Detector Animation',url: 'https://rangavirender.github.io/site/scintillation_detector_animation.html' },
      { name: 'GEANT4 Installation Guide',       url: 'https://www.vranga.in/geant4' },
      /* ADD NEW ANIMATIONS HERE */
    ],
  },
  {
    title: 'Post-doc positions',
    color: 'teal',
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
             <rect x="4" y="2" width="16" height="20" rx="2"/>
             <path d="M8 7h8M8 11h8M8 15h5"/>
           </svg>`,
    links: [
      { name: 'FRIB',       url: 'https://fribusers.org/nuclearmatters/#' },
      
      /* ADD NEW CALCULATORS HERE */
    ],
  }
  /* ADD A WHOLE NEW SECTION HERE if needed — copy the object above */
];

/* ── Render sections ── */
(function renderSections() {
  const wrap = document.querySelector('.wrap');
  const footer = wrap.querySelector('footer');

  SECTIONS.forEach(({ title, color, icon, links }) => {
    const section = document.createElement('section');

    const cards = links.map(({ name, url }) => {
      const domain = new URL(url).hostname.replace(/^www\./, '');
      return `<a class="card ${color}" href="${url}" target="_blank" rel="noopener">
        <span class="card-dot"></span>
        <div class="card-text">
          <div class="card-name">${name}</div>
          <div class="card-url">${domain}</div>
        </div>
      </a>`;
    }).join('');

    section.innerHTML = `
      <div class="section-header">
        <div class="section-icon ${color}">${icon}</div>
        <span class="section-title">${title}</span>
      </div>
      <div class="grid">${cards}</div>`;

    wrap.insertBefore(section, footer);
  });
})();

/* ── Particle track canvas ── */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const tracks = [];
const COLORS = ['#4ecdc4', '#ff6b35', '#a78bfa', '#38bdf8'];

function randomTrack() {
  const angle = Math.random() * Math.PI * 2;
  const speed = 0.4 + Math.random() * 0.8;
  return {
    x: canvas.width * 0.5 + (Math.random() - 0.5) * 200,
    y: canvas.height * 0.28,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    life: 0,
    maxLife: 120 + Math.random() * 200,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    width: 0.6 + Math.random() * 0.8,
    trail: [],
  };
}

for (let i = 0; i < 14; i++) {
  const t = randomTrack();
  t.life = Math.random() * t.maxLife;
  tracks.push(t);
}

let frame = 0;
function draw() {
  frame++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (frame % 40 === 0 && tracks.length < 20) {
    tracks.push(randomTrack());
  }

  for (let i = tracks.length - 1; i >= 0; i--) {
    const t = tracks[i];
    t.life++;
    t.x += t.vx;
    t.y += t.vy;
    // slight curve
    t.vx += (Math.random() - 0.5) * 0.015;
    t.vy += (Math.random() - 0.5) * 0.015;
    t.trail.push({ x: t.x, y: t.y });
    if (t.trail.length > 60) t.trail.shift();

    if (t.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(t.trail[0].x, t.trail[0].y);
      for (let j = 1; j < t.trail.length; j++) {
        ctx.lineTo(t.trail[j].x, t.trail[j].y);
      }
      const alpha = (1 - t.life / t.maxLife) * 0.7;
      ctx.strokeStyle = t.color + Math.floor(alpha * 255).toString(16).padStart(2,'0');
      ctx.lineWidth = t.width;
      ctx.stroke();
    }

    if (t.life >= t.maxLife) {
      tracks.splice(i, 1);
    }
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
